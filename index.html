<!DOCTYPE html>
<html>
    <head>
    <title>Simple Interest Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    </head>
   <body>
    <main class="maindiv">
        <h1>Simple Interest Calculator</h1>
        
        <form id="calculator-form" onsubmit="event.preventDefault(); compute();">
            <div class="form-group">
                <label for="principal">Amount ($)</label>
                <input type="number"
                       id="principal"
                       min="0.01"
                       step="0.01"
                       placeholder="Enter amount"
                       required
                       aria-describedby="principal-error">
                <span id="principal-error" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="rate">Interest Rate (%)</label>
                <input type="range"
                       id="rate"
                       min="1"
                       max="20"
                       value="10.25"
                       step="0.25"
                       aria-label="Interest rate slider"
                       oninput="updateRateDisplay(this.value)">
                <output id="rate_val" for="rate">10.25</output>%
            </div>

            <div class="form-group">
                <label for="years">Number of Years</label>
                <input type="number"
                       id="years"
                       min="1"
                       max="100"
                       placeholder="Enter years"
                       required
                       aria-describedby="years-error">
                <span id="years-error" class="error-message" role="alert"></span>
            </div>

            <div class="result-section">
                <label>Interest:</label>
                <output id="result" for="principal rate years">$0.00</output>
            </div>

            <button type="submit">Compute Interest</button>
        </form>
    </main>
</body>
</html>
